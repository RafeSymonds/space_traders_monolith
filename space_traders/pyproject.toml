[project]
name = "space_traders"
version = "1.0.0"
description = "SpaceTraders FastAPI Service"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-dotenv>=1.0.0",
    "urllib3>=2.1.0,<3.0.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.0.0",
    "typing-extensions>=4.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "ALL",
]
ignore = [
    "FBT001",
    "FBT002",
    "FBT003",
    "S101",
    "DTZ005",
    "D",
    "A",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
